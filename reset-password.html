<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重置密码</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f2f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            padding: 36px 32px;
            max-width: 380px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1e293b;
        }

        .header p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
        }

        .status-box {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }

        .status-box.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .status-box.success {
            display: block;
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.12);
            background: #ffffff;
        }

        .form-group input::placeholder {
            color: #cbd5e1;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            background: #334155;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1e293b;
        }

        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #94a3b8;
        }

        .footer a {
            color: #475569;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .mt-2 {
            margin-top: 12px;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 18px 0 16px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>重置密码</h1>
            <p>请设置您的新密码</p>
        </div>

        <div id="statusBox" class="status-box"></div>

        <div id="resetForm">
            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="至少 6 个字符" />
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码" />
            </div>
            <button id="resetBtn" class="btn">确认重置</button>
        </div>

        <div id="successArea" class="hidden">
            <div class="status-box success" style="display:block;text-align:center;">
                密码重置成功！<br />
                <div class="mt-2">
                    <a href="http://mugen.dpdns.org/login.html" style="color:#334155;font-weight:500;">前往登录</a>
                </div>
            </div>
        </div>

        <div class="divider"></div>
        <div class="footer">
            <a href="http://mugen.dpdns.org">返回首页</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zsqqyvmoejbljzvztclf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_W8Wz85rKZOwqa76AG0WNGw_JjK2_8qE';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusBox = document.getElementById('statusBox');
        const resetForm = document.getElementById('resetForm');
        const successArea = document.getElementById('successArea');
        const newPw = document.getElementById('newPassword');
        const confirmPw = document.getElementById('confirmPassword');
        const resetBtn = document.getElementById('resetBtn');

        let verified = false;

        function showStatus(msg, type) {
            statusBox.textContent = msg;
            statusBox.className = 'status-box ' + type;
        }

        function hideStatus() {
            statusBox.className = 'status-box';
            statusBox.textContent = '';
        }

        (async function init() {
            // 先读 ? 参数
            const params = new URLSearchParams(window.location.search);
            let tokenHash = params.get('token_hash') || params.get('access_token');
            let type = params.get('type');

            // 如果 ? 里没有，从 # 里读
            if (!tokenHash) {
                const hash = window.location.hash;
                if (hash) {
                    const hashParams = new URLSearchParams(hash.substring(1));
                    tokenHash = hashParams.get('access_token');
                    type = hashParams.get('type');
                }
            }

            if (!tokenHash || type !== 'recovery') {
                showStatus('链接无效或已过期，请重新发送重置邮件。', 'error');
                resetBtn.disabled = true;
                return;
            }

            try {
                const { data, error } = await supabase.auth.verifyOtp({
                    token_hash: tokenHash,
                    type: 'recovery'
                });

                if (error) {
                    showStatus(error.message || '验证失败，链接可能已过期。', 'error');
                    resetBtn.disabled = true;
                    return;
                }

                verified = true;
                showStatus('请设置您的新密码', 'success');

            } catch (err) {
                showStatus('验证请求失败，请重试。', 'error');
                resetBtn.disabled = true;
            }
        })();

        resetBtn.addEventListener('click', async function() {
            if (!verified) {
                showStatus('链接无效，请重新发送重置邮件。', 'error');
                return;
            }

            const password = newPw.value.trim();
            const confirm = confirmPw.value.trim();

            if (password.length < 6) {
                showStatus('密码至少 6 个字符', 'error');
                return;
            }

            if (password !== confirm) {
                showStatus('两次输入的密码不一致', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = '提交中...';
            hideStatus();

            try {
                const { error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) {
                    showStatus(error.message || '重置失败，请重试。', 'error');
                    resetBtn.disabled = false;
                    resetBtn.textContent = '确认重置';
                    return;
                }

                resetForm.classList.add('hidden');
                successArea.classList.remove('hidden');

            } catch (err) {
                showStatus('网络错误，请重试。', 'error');
                resetBtn.disabled = false;
                resetBtn.textContent = '确认重置';
            }
        });
    </script>

</body>
</html>
