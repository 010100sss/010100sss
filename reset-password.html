<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>重置密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass {
            background: rgba(18, 18, 24, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 24px;
            padding: 36px 32px;
            max-width: 380px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
        }
        .header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            margin-top: 4px;
        }
        .field {
            position: relative;
            margin-bottom: 14px;
        }
        .field .icn {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }
        .ipt {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .14);
            background: rgba(255, 255, 255, .07);
            color: #fff;
            font-size: 14px;
            transition: border-color .2s;
        }
        .ipt::placeholder {
            color: rgba(255, 255, 255, .4);
        }
        .ipt:focus {
            outline: none;
            background: rgba(255, 255, 255, .13);
            border-color: rgba(255, 255, 255, .32);
        }
        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: #fff;
            color: #171717;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: transform .15s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, .88);
            transform: translateY(-1px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        .msg.err {
            display: block;
            background: rgba(239, 68, 68, .15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, .3);
        }
        .msg.ok {
            display: block;
            background: rgba(255, 255, 255, .08);
            color: rgba(255, 255, 255, .7);
            border: 1px solid rgba(255, 255, 255, .1);
        }
        .footer {
            text-align: center;
            margin-top: 18px;
        }
        .footer a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 13px;
        }
        .footer a:hover {
            color: rgba(255, 255, 255, 0.6);
        }
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, .08);
            margin: 18px 0 16px 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js">
    </script>
</head>
<body>

    <div class="glass">
        <div class="header">
            <h1>重置密码</h1>
            <p id="subTitle">请输入您的新密码</p>
        </div>

        <div id="msgBox" class="msg"></div>

        <div id="resetForm">
            <div class="field">
                <svg class="icn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                <input id="newPassword" type="password" placeholder="新密码（至少6位）" class="ipt" autocomplete="new-password">
            </div>
            <div class="field">
                <svg class="icn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                <input id="confirmPassword" type="password" placeholder="确认新密码" class="ipt" autocomplete="new-password">
            </div>
            <button id="resetBtn" class="btn" onclick="handleReset()">确认重置</button>
        </div>

        <div id="successArea" style="display:none;text-align:center;">
            <div class="msg ok" style="display:block;">
                ✅ 密码重置成功！<br /><br />
                <a href="http://mugen.dpdns.org/login.html" style="color:rgba(255,255,255,0.6);">前往登录</a>
            </div>
        </div>

        <div class="divider"></div>
        <div class="footer">
            <a href="http://mugen.dpdns.org">返回首页</a>
        </div>
    </div>

    <script>
        // ============ Supabase 配置 ============
        const SUPABASE_URL = 'https://zsqqyvmoejbljzvztclf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_W8Wz85rKZOwqa76AG0WNGw_JjK2_8qE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msgBox = document.getElementById('msgBox');
        const resetForm = document.getElementById('resetForm');
        const successArea = document.getElementById('successArea');
        const subTitle = document.getElementById('subTitle');
        const newPw = document.getElementById('newPassword');
        const confirmPw = document.getElementById('confirmPassword');
        const resetBtn = document.getElementById('resetBtn');

        let tokenHash = null;
        let verified = false;

        function showMsg(msg, isErr) {
            if (!msg) { msgBox.className = 'msg';
                msgBox.textContent = '';
                return; }
            msgBox.className = 'msg ' + (isErr ? 'err' : 'ok');
            msgBox.textContent = msg;
        }

        // ============ 页面加载 ============
        (function init() {
            // 从 URL 提取 token（支持 ? 和 #）
            const params = new URLSearchParams(window.location.search);
            tokenHash = params.get('token_hash') || params.get('access_token');
            let type = params.get('type');

            if (!tokenHash) {
                const hash = window.location.hash;
                if (hash) {
                    const hashParams = new URLSearchParams(hash.substring(1));
                    tokenHash = hashParams.get('access_token');
                    type = hashParams.get('type');
                }
            }

            if (!tokenHash) {
                const fullUrl = window.location.href;
                const match = fullUrl.match(/[?&]token_hash=([^&]+)/);
                if (match) tokenHash = match[1];
                if (!type) {
                    const typeMatch = fullUrl.match(/[?&]type=([^&]+)/);
                    if (typeMatch) type = typeMatch[1];
                }
            }

            if (!tokenHash) {
                showMsg('链接无效，请重新发送重置邮件', true);
                subTitle.textContent = '链接无效';
                resetBtn.disabled = true;
                return;
            }

            if (type !== 'recovery') {
                showMsg('链接类型错误，请重新发送重置邮件', true);
                subTitle.textContent = '链接无效';
                resetBtn.disabled = true;
                return;
            }

            subTitle.textContent = '正在验证...';
            showMsg('正在验证链接...', false);

            supabase.auth.verifyOtp({
                token_hash: tokenHash,
                type: 'recovery'
            }).then(({ data, error }) => {
                if (error) {
                    showMsg(error.message || '验证失败，链接可能已过期', true);
                    subTitle.textContent = '验证失败';
                    resetBtn.disabled = true;
                    return;
                }

                verified = true;
                subTitle.textContent = '请设置新密码';
                showMsg('验证通过，请设置新密码', false);

            }).catch((err) => {
                showMsg('验证请求失败，请重试', true);
                subTitle.textContent = '验证失败';
                resetBtn.disabled = true;
            });

        })();

        // ============ 确认重置 ============
        async function handleReset() {
            if (!verified) {
                showMsg('链接无效，请重新发送重置邮件', true);
                return;
            }

            const password = newPw.value.trim();
            const confirm = confirmPw.value.trim();

            if (password.length < 6) {
                showMsg('密码至少需要6位', true);
                return;
            }

            if (password !== confirm) {
                showMsg('两次输入的密码不一致', true);
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = '提交中...';
            showMsg('正在更新密码...', false);

            try {
                const { error } = await supabase.auth.updateUser({
                    password: password
                });

                if (error) {
                    showMsg(error.message || '重置失败，请重试', true);
                    resetBtn.disabled = false;
                    resetBtn.textContent = '确认重置';
                    return;
                }

                resetForm.style.display = 'none';
                successArea.style.display = 'block';
                subTitle.textContent = '重置成功';
                showMsg('', false);

            } catch (err) {
                showMsg('网络错误，请重试', true);
                resetBtn.disabled = false;
                resetBtn.textContent = '确认重置';
            }
        }

        console.log('reset-password.html 已加载');
        console.log('当前URL:', window.location.href);
    </script>

</body>
</html>
