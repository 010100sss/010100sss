<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>重置密码</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e0e5ec;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif}
.box{background:#e0e5ec;border-radius:24px;padding:36px 32px;max-width:360px;width:100%;box-shadow:8px 8px 16px #b8bec7,-8px -8px 16px #fff}
h2{text-align:center;color:#2c3e50;font-size:20px;margin-bottom:4px}
.sub{text-align:center;color:#7f8c8d;font-size:13px;margin-bottom:20px}
.ipt{width:100%;padding:12px 14px;margin-bottom:14px;border-radius:12px;border:none;background:#e0e5ec;box-shadow:inset 4px 4px 8px #b8bec7,inset -4px -4px 8px #fff;color:#2c3e50;font-size:14px;outline:none}
.ipt::placeholder{color:#95a5a6}
.btn{width:100%;padding:12px;border-radius:12px;border:none;background:#e0e5ec;box-shadow:6px 6px 12px #b8bec7,-6px -6px 12px #fff;color:#2c3e50;font-weight:600;font-size:14px;cursor:pointer;transition:.1s}
.btn:active{box-shadow:inset 4px 4px 8px #b8bec7,inset -4px -4px 8px #fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{padding:10px;border-radius:10px;font-size:13px;text-align:center;margin-bottom:12px;display:none}
.msg.err{display:block;background:rgba(231,76,60,.1);color:#c0392b}
.msg.ok{display:block;background:rgba(46,204,113,.1);color:#27ae60}
.msg.loading{display:block;color:#7f8c8d}
.done{text-align:center;color:#27ae60;font-size:15px;padding:8px 0}
</style>
</head>
<body>
<div class="box">
<h2>重置密码</h2><div class="sub" id="sub">请输入您的新密码</div>
<div id="msg" class="msg loading">加载中...</div>
<div id="form"><input id="pw" type="password" placeholder="新密码（至少6位）" class="ipt"><button id="btn" class="btn" onclick="handleReset()">确认设置</button></div>
<div id="ok" style="display:none"><div class="done">重置密码完成</div></div>
</div>
<script>
const _sb=supabase.createClient('https://zsqqyvmoejbljzvztclf.supabase.co','sb_publishable_W8Wz85rKZOwqa76AG0WNGw_JjK2_8qE');
const $=id=>document.getElementById(id),msg=$('msg'),sub=$('sub'),form=$('form'),ok=$('ok'),pw=$('pw'),btn=$('btn');
function setMsg(t,e){if(!t){msg.className='msg';msg.textContent='';return}msg.className='msg '+(e?'err':'ok');msg.textContent=t}
function transErr(m){if(!m)return'操作失败';const l=m.toLowerCase();if(l.includes('invalid')||l.includes('expired'))return'邮件链接无效或已过期';if(l.includes('different'))return'新密码不能与旧密码相同';return m}
async function handleReset(){const v=pw.value;if(!v||v.length<6){setMsg('密码至少需要6位',1);return}btn.disabled=1;btn.textContent='请稍候…';setMsg('正在更新...',0);const{error}=await _sb.auth.updateUser({password:v});btn.disabled=0;btn.textContent='确认设置';if(error)setMsg(transErr(error.message),1);else{form.style.display='none';ok.style.display='block';sub.textContent='重置成功';setMsg('',0)}}
(function(){const h=window.location.hash;msg.textContent='加载中...';msg.className='msg loading';if(h&&h.includes('access_token')){const p=new URLSearchParams(h.substring(1)),t=p.get('access_token'),ty=p.get('type');if(t&&ty==='recovery'){msg.textContent='正在验证令牌...';_sb.auth.verifyOtp({token_hash:t,type:'recovery'}).then(({error})=>{if(error){setMsg(transErr(error.message),1);sub.textContent='验证失败';btn.disabled=1;return}setMsg('验证通过，请设置新密码',0);sub.textContent='请设置新密码';btn.disabled=0}).catch(()=>{setMsg('验证请求失败，请重试',1);sub.textContent='验证失败';btn.disabled=1});return}}setMsg('链接无效，请重新发送重置邮件',1);sub.textContent='链接无效';btn.disabled=1})();
</script>
</body>
</html>
