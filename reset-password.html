<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>重置密码</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js">
    </script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,sans-serif;background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .glass{background:rgba(18,18,24,0.6);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:36px 32px;max-width:380px;width:100%}
        .header{text-align:center;margin-bottom:24px}
        .header h1{color:#fff;font-size:22px;font-weight:600}
        .header p{color:rgba(255,255,255,0.4);font-size:13px;margin-top:4px}
        .field{position:relative;margin-bottom:14px}
        .field .icn{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.3);pointer-events:none}
        .ipt{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-size:14px;transition:border-color .2s}
        .ipt::placeholder{color:rgba(255,255,255,.4)}
        .ipt:focus{outline:none;background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.32)}
        .btn{width:100%;padding:13px;border-radius:12px;border:none;background:#fff;color:#171717;font-weight:500;font-size:14px;cursor:pointer;transition:transform .15s}
        .btn:hover{background:rgba(255,255,255,.88);transform:translateY(-1px)}
        .btn:disabled{opacity:0.5;cursor:not-allowed}
        .msg{padding:10px 14px;border-radius:10px;font-size:13px;text-align:center;margin-bottom:12px;display:none}
        .msg.err{display:block;background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
        .msg.ok{display:block;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.1)}
        .msg.loading{display:block;background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.05)}
        .footer{text-align:center;margin-top:18px}
        .footer a{color:rgba(255,255,255,0.3);text-decoration:none;font-size:13px}
        .footer a:hover{color:rgba(255,255,255,0.6)}
        .divider{height:1px;background:rgba(255,255,255,.08);margin:18px 0 16px 0}
    </style>
</head>
<body>

    <div class="glass">
        <div class="header">
            <h1>重置密码</h1>
            <p id="subTitle">请输入您的新密码</p>
        </div>

        <div id="msgBox" class="msg loading">⏳ 正在加载...</div>

        <div id="resetForm">
            <div class="field">
                <svg class="icn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                <input id="lgNewPsw" type="password" placeholder="新密码（至少6位）" class="ipt" autocomplete="new-password">
            </div>
            <button id="lgResetBtn" class="btn" onclick="handleResetPassword()">确认设置</button>
        </div>

        <div id="successArea" style="display:none;text-align:center;">
            <div class="msg ok" style="display:block;">✅ 密码重置成功！<br /><br /><a href="http://mugen.dpdns.org/login.html" style="color:rgba(255,255,255,0.6);">前往登录</a></div>
        </div>

        <div class="divider"></div>
        <div class="footer"><a href="http://mugen.dpdns.org">返回首页</a></div>
    </div>

    <script>
        // ===== 直接从测试2.html 复制的 Supabase 配置 =====
        const _SB_URL = 'https://zsqqyvmoejbljzvztclf.supabase.co';
        const _SB_KEY = 'sb_publishable_W8Wz85rKZOwqa76AG0WNGw_JjK2_8qE';
        const _sb = supabase.createClient(_SB_URL, _SB_KEY);

        const msgBox = document.getElementById('msgBox');
        const subTitle = document.getElementById('subTitle');
        const resetForm = document.getElementById('resetForm');
        const successArea = document.getElementById('successArea');
        const lgNewPsw = document.getElementById('lgNewPsw');
        const lgResetBtn = document.getElementById('lgResetBtn');

        function setResetMsg(msg, isErr) {
            if (!msg) { msgBox.className = 'msg';
                msgBox.textContent = '';
                return; }
            msgBox.className = 'msg ' + (isErr ? 'err' : 'ok');
            msgBox.textContent = msg;
        }

        // ===== 从测试2.html 复制过来的 handleResetPassword =====
        async function handleResetPassword() {
            const pw = document.getElementById('lgNewPsw').value;
            if (!pw || pw.length < 6) {
                setResetMsg('密码至少需要6位', true);
                return;
            }
            lgResetBtn.disabled = true;
            lgResetBtn.textContent = '请稍候…';
            setResetMsg('正在更新密码...', false);

            const { error } = await _sb.auth.updateUser({ password: pw });

            lgResetBtn.disabled = false;
            lgResetBtn.textContent = '确认设置';
            if (error) {
                setResetMsg(error.message || '设置失败', true);
            } else {
                resetForm.style.display = 'none';
                successArea.style.display = 'block';
                subTitle.textContent = '重置成功';
                setResetMsg('', false);
            }
        }

        // ===== 页面加载时检测重置密码链接（从测试2.html 复制） =====
        (function checkResetPassword() {
            const hash = window.location.hash;
            msgBox.textContent = '⏳ 检测到链接，正在验证...';
            msgBox.className = 'msg loading';

            if (hash && hash.includes('access_token')) {
                // 从 hash 中提取 token
                const params = new URLSearchParams(hash.substring(1));
                const tokenHash = params.get('access_token');
                const type = params.get('type');

                if (tokenHash && type === 'recovery') {
                    msgBox.textContent = '⏳ 正在验证令牌...';
                    _sb.auth.verifyOtp({
                        token_hash: tokenHash,
                        type: 'recovery'
                    }).then(({ data, error }) => {
                        if (error) {
                            setResetMsg('验证失败：' + error.message, true);
                            subTitle.textContent = '验证失败';
                            lgResetBtn.disabled = true;
                            return;
                        }
                        setResetMsg('验证通过，请设置新密码', false);
                        subTitle.textContent = '请设置新密码';
                        lgResetBtn.disabled = false;
                    }).catch((err) => {
                        setResetMsg('验证请求失败，请重试', true);
                        subTitle.textContent = '验证失败';
                        lgResetBtn.disabled = true;
                    });
                    return;
                }
            }

            // 没有 token 或格式不对
            setResetMsg('链接无效，请重新发送重置邮件', true);
            subTitle.textContent = '链接无效';
            lgResetBtn.disabled = true;
        })();
    </script>

</body>
</html>
